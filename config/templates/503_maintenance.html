<!DOCTYPE html>
<html lang="es-MX">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Ryal Sneakers — Mantenimiento</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #D4AF37;
      --gold-light: #F5E7B3;
      --gold-glow: rgba(212, 175, 55, 0.4);
      --black: #0a0a0a;
      --gray-dark: #111111;
      --gray: #1C1C1C;
      --text-muted: #aaaaaa;
      --transition-default: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0f0f0f, var(--black));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo animado con partículas sutiles */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--gold) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.05;
      pointer-events: none;
      animation: shiftBackground 30s linear infinite;
    }

    @keyframes shiftBackground {
      0% {
        background-position: 0 0;
      }

      100% {
        background-position: 40px 40px;
      }
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: rgba(10, 10, 10, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      border: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.1);
      transition: var(--transition-default);
      animation: fadeInUp 0.8s ease-out;
    }

    /* Animación de entrada */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Logo + efecto shine */
    .logo {
      font-family: 'Syne', 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, var(--gold) 0%, #fff0c0 50%, var(--gold) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
      margin-bottom: 2rem;
      animation: shimmer 6s linear infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 0% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    /* Icono animado (engranaje / herramienta) */
    .icon-wrapper {
      display: inline-block;
      margin-bottom: 1.8rem;
      animation: float 3s ease-in-out infinite;
    }

    .icon {
      font-size: 4rem;
      display: inline-block;
      filter: drop-shadow(0 0 8px var(--gold-glow));
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-12px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    /* Título con destello */
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      background: linear-gradient(120deg, #fff, #e0e0e0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    /* Línea divisoria animada */
    .divider {
      width: 70px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
      margin: 1.8rem auto;
      border-radius: 2px;
      animation: expandLine 1.2s ease-out infinite alternate;
    }

    @keyframes expandLine {
      0% {
        width: 40px;
        opacity: 0.5;
      }

      100% {
        width: 120px;
        opacity: 1;
      }
    }

    p {
      color: var(--text-muted);
      line-height: 1.65;
      font-size: 1rem;
      max-width: 360px;
      margin: 0 auto;
    }

    /* Status badge con animación y cambio de texto */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      background: rgba(28, 28, 28, 0.9);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 999px;
      padding: 0.5rem 1.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--gold-light);
      margin-top: 2.5rem;
      transition: var(--transition-default);
    }

    .status:hover {
      border-color: var(--gold);
      background: rgba(28, 28, 28, 1);
      transform: scale(1.02);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
      animation: pulseDot 1.5s ease-in-out infinite;
    }

    @keyframes pulseDot {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
        background: #ffdf80;
      }
    }

    /* Texto del estado con animación de escritura cíclica */
    .status-text {
      position: relative;
      white-space: nowrap;
    }

    .status-text::after {
      content: '';
      position: absolute;
      right: -8px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 14px;
      background: var(--gold);
      animation: blinkCursor 1s step-end infinite;
    }

    @keyframes blinkCursor {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* Pequeño detalle decorativo: líneas móviles */
    .bg-decoration {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      color: rgba(212, 175, 55, 0.2);
      font-family: monospace;
      letter-spacing: 2px;
      animation: fadeText 4s infinite;
    }

    @keyframes fadeText {

      0%,
      100% {
        opacity: 0.2;
      }

      50% {
        opacity: 0.6;
      }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.2rem;
      }

      .logo {
        font-size: 1.4rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .icon {
        font-size: 3rem;
      }

      .status {
        padding: 0.4rem 1.2rem;
        font-size: 0.75rem;
      }

      .status-text::after {
        height: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">Ryal Sneakers</div>

    <div class="icon-wrapper">
      <span class="icon">⚙️</span>
    </div>

    <h1>Estamos afinando cada detalle</h1>

    <div class="divider"></div>

    <p>
      Actualizamos nuestro catálogo y experiencia de compra.<br>
      Volvemos con fuerza — gracias por tu paciencia.
    </p>

    <div class="status">
      <span class="dot"></span>
      <span class="status-text">Trabajando en ello</span>
    </div>
  </div>

  <div class="bg-decoration">
    ✦ RYAL // IMPORTACIÓN DIRECTA ✦
  </div>

  <!-- Script opcional para cambiar el texto del estado cíclicamente (más dinamismo) -->
  <script>
    (function () {
      const statusSpan = document.querySelector('.status-text');
      if (!statusSpan) return;
      const messages = ['Trabajando en ello', 'Afinando el drop', 'Casi listo', 'Mejorando la tienda'];
      let idx = 0;
      setInterval(() => {
        idx = (idx + 1) % messages.length;
        statusSpan.textContent = messages[idx];
      }, 3000);
    })();
  </script>
</body>

</html>
