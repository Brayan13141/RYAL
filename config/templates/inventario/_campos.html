{% for e in form.non_field_errors %}<div class="inv-alert inv-alert-bad py-2"><i class="bi bi-x-octagon-fill"></i><div>{{ e }}</div></div>{% endfor %}
{% for field in form %}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="small mt-1" style="color:var(--inv-bad)">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
