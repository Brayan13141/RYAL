{% for e in form.non_field_errors %}<div style="color:#f87171;font-size:12px">{{ e }}</div>{% endfor %}
{% for field in form %}
<div class="mb-2">
  <label for="{{ field.id_for_label }}" class="small" style="color:#e0e0e0">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div style="color:#f87171;font-size:12px">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
